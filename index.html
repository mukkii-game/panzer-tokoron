<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>パンツァートコろーん</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#79d4f2; touch-action:none; overscroll-behavior:none;
    font-family:'Hiragino Maru Gothic ProN','BIZ UDGothic','Yu Gothic UI',system-ui,sans-serif; user-select:none; -webkit-user-select:none; }
  #game-canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }

  /* ===== HUD ===== */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #score { position:absolute; top:calc(10px + env(safe-area-inset-top)); right:16px; font-size:clamp(18px,3.5vw,28px); font-weight:900;
    color:#fff; text-shadow:0 2px 0 #e8871e, 0 0 8px rgba(0,0,0,.25); letter-spacing:1px; }
  #hearts { position:absolute; top:calc(8px + env(safe-area-inset-top)); left:16px; font-size:clamp(14px,2.8vw,24px); text-shadow:0 2px 2px rgba(0,0,0,.3); max-width:55vw; line-height:1.2; }
  #lockinfo { position:absolute; top:calc(46px + env(safe-area-inset-top)); right:16px; font-size:clamp(14px,2.5vw,20px); font-weight:900;
    color:#ffe93d; text-shadow:0 1px 0 #c2440a, 0 0 6px rgba(0,0,0,.3); }
  #stage-msg { position:absolute; top:22%; left:50%; transform:translateX(-50%); font-size:clamp(22px,5vw,42px); font-weight:900;
    color:#fff; text-shadow:0 3px 0 #2a6db5, 0 0 14px rgba(0,0,0,.35); white-space:nowrap; opacity:0; transition:opacity .5s; }
  #combo-msg { position:absolute; top:34%; left:50%; transform:translateX(-50%) rotate(-4deg); font-size:clamp(18px,4vw,32px); font-weight:900;
    color:#ffe93d; text-shadow:0 2px 0 #d1420b; opacity:0; white-space:nowrap; }
  #bossbar-wrap { position:absolute; bottom:calc(90px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    width:min(70vw,520px); display:none; }
  #bossbar-label { text-align:center; color:#fff; font-weight:900; font-size:14px; text-shadow:0 1px 2px #000; margin-bottom:3px; }
  #bossbar-bg { height:14px; background:rgba(0,0,0,.45); border-radius:7px; border:2px solid #fff; overflow:hidden; }
  #bossbar { height:100%; width:100%; background:linear-gradient(#ff8a5c,#e8380d); border-radius:5px; transition:width .15s; }

  #damage-flash { position:fixed; inset:0; pointer-events:none; z-index:15; background:radial-gradient(ellipse at center, transparent 40%, rgba(255,40,40,.55) 100%);
    opacity:0; transition:opacity .5s; }

  /* ===== reticle ===== */
  #reticle { position:fixed; width:56px; height:56px; margin:-28px 0 0 -28px; pointer-events:none; z-index:11; display:none; }
  #reticle .ring { position:absolute; inset:0; border:3px solid #fff; border-radius:50%; box-shadow:0 0 6px rgba(0,0,0,.4), inset 0 0 6px rgba(0,0,0,.3); }
  #reticle .dot { position:absolute; left:50%; top:50%; width:6px; height:6px; margin:-3px; background:#ff4d6d; border-radius:50%; }
  #reticle.locking .ring { border-color:#ffe93d; animation:spin 1s linear infinite; border-style:dashed; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ===== overlay screens ===== */
  .screen { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; background:rgba(30,90,140,.35); backdrop-filter:blur(2px); }
  .hidden { display:none !important; }
  #title-logo { font-size:clamp(34px,9vw,84px); font-weight:900; color:#ffb300; -webkit-text-stroke:2px #fff;
    text-shadow:0 5px 0 #b35c00, 0 10px 22px rgba(0,0,0,.4); transform:rotate(-3deg); line-height:1.15; }
  #title-sub { margin-top:10px; font-size:clamp(16px,3.6vw,28px); color:#fff; font-weight:800; text-shadow:0 2px 6px rgba(0,0,0,.55); max-width:94vw; line-height:1.5; letter-spacing:0.04em; }
  .btn { margin-top:26px; padding:14px 44px; font-size:clamp(18px,4vw,26px); font-weight:900; color:#fff; background:linear-gradient(#ffb300,#f07800);
    border:3px solid #fff; border-radius:40px; cursor:pointer; box-shadow:0 5px 0 #a85a00, 0 8px 16px rgba(0,0,0,.35); pointer-events:auto; }
  .btn:active { transform:translateY(4px); box-shadow:0 1px 0 #a85a00; }
  .howto { margin-top:22px; color:#fff; font-size:clamp(12px,2.4vw,16px); line-height:1.9; text-shadow:0 1px 3px rgba(0,0,0,.6); font-weight:700; }
  .result-title { font-size:clamp(30px,7vw,64px); font-weight:900; color:#fff; -webkit-text-stroke:1px #333; text-shadow:0 4px 0 rgba(0,0,0,.4); }
  .result-score { margin-top:14px; font-size:clamp(20px,5vw,36px); font-weight:900; color:#ffe93d; text-shadow:0 2px 0 #b3540b; }

  /* ===== touch UI ===== */
  #stick { position:fixed; width:110px; height:110px; border:3px solid rgba(255,255,255,.7); border-radius:50%;
    background:rgba(255,255,255,.12); z-index:12; display:none; pointer-events:none; }
  #stick-knob { position:absolute; left:50%; top:50%; width:48px; height:48px; margin:-24px; background:rgba(255,255,255,.75); border-radius:50%; }
  #touch-hint { position:fixed; bottom:calc(12px + env(safe-area-inset-bottom)); width:100%; text-align:center; color:rgba(255,255,255,.9);
    font-size:12px; font-weight:700; text-shadow:0 1px 2px #000; z-index:10; pointer-events:none; display:none; }
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>

<div id="hud">
  <div id="hearts"></div>
  <div id="score">SCORE 0</div>
  <div id="lockinfo"></div>
  <div id="stage-msg"></div>
  <div id="combo-msg"></div>
  <div id="bossbar-wrap">
    <div id="bossbar-label">ヤキダンゴドラゴン</div>
    <div id="bossbar-bg"><div id="bossbar"></div></div>
  </div>
</div>

<div id="damage-flash"></div>
<div id="reticle"><div class="ring"></div><div class="dot"></div></div>
<div id="stick"><div id="stick-knob"></div></div>
<div id="touch-hint">左：移動スティック ／ 右：照準・押しっぱなしでロックオン→離して発射</div>

<div id="title-screen" class="screen">
  <div id="title-logo">パンツァー<br>トコろーん</div>
  <div id="title-sub">所沢本土決戦　基地全面返還は市民の願い</div>
  <button id="start-btn" class="btn">とんでくよ！</button>
  <div class="howto" id="howto-pc">
    移動：WASD / 矢印キー ｜ 照準：マウス<br>
    左クリック：ショット連射 ｜ 右クリック長押し：ロックオン → 離してホーミング一斉発射
  </div>
</div>

<div id="result-screen" class="screen hidden">
  <div class="result-title" id="result-title">ミッションクリア！</div>
  <div class="result-score" id="result-score">SCORE 0</div>
  <button id="retry-btn" class="btn">もういっかい！</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
